[project]
name = "ward-agent"
version = "0.1.0"
description = "Ward policy agent — turns user intent into TEE-signed Safety Envelopes enforced by the on-chain Guardian"
requires-python = ">=3.12"
dependencies = [
    "web3>=7.6",
    "eth-account>=0.13",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[project.scripts]
ward-agent = "ward_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ward_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
